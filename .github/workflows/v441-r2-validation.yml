name: Tributo Leve v4.4.2 Admin Release Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-v442-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 6d5c2fe4-d765-4d88-967c-5d2d1b695fa1
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact audited R2 candidate
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .ci-v441-r2/part_00 \
            .ci-v441-r2/part_01 \
            .ci-v441-r2/p02/seg_* \
            .ci-v441-r2/part_03 \
            .ci-v441-r2/part_04 \
            .ci-v441-r2/part_05 \
            .ci-v441-r2/part_06 \
            .ci-v441-r2/part_07 \
            .ci-v441-r2/part_08 \
            .ci-v441-r2/part_09 \
            > /tmp/v441-r2.patch.xz.b64
          test "$(wc -c < /tmp/v441-r2.patch.xz.b64)" -eq 74824
          echo "346df010314eaf3bb736f00fa4855639ada17e19763a9a3515d966fd235800c8  /tmp/v441-r2.patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/v441-r2.patch.xz.b64 > /tmp/v441-r2.patch.xz
          test "$(wc -c < /tmp/v441-r2.patch.xz)" -eq 56116
          echo "12569ea9980114759349a41f503ec14df0347c1f0311ad9d4b41ff5ab9b28d9e  /tmp/v441-r2.patch.xz" | sha256sum -c -
          xz -dc /tmp/v441-r2.patch.xz > /tmp/v441-r2.patch
          echo "7be0ac07efa4a7e96d5d0e4abfef4ecb1949865fd40540307451525768b960ab  /tmp/v441-r2.patch" | sha256sum -c -

          git apply --check --exclude=PUBLICAR_NETLIFY.bat --exclude=vite.config.d.ts /tmp/v441-r2.patch
          git apply --exclude=PUBLICAR_NETLIFY.bat --exclude=vite.config.d.ts /tmp/v441-r2.patch

          python - <<'PY'
          from pathlib import Path
          p = Path('PUBLICAR_NETLIFY.bat')
          s = p.read_text(encoding='utf-8')
          pairs = [
              ('title Tributo Leve - Publicar no Netlify', 'title Tributo Leve 4.4.1 - Publicar no Netlify'),
              ('Tributo Leve v4.3.1 - hotfix deploy Netlify 422 retry', 'Tributo Leve v4.4.1 Final - deploy Netlify 422 retry'),
              ('Tributo Leve v4.3.1 - hotfix deploy Netlify 422', 'Tributo Leve v4.4.1 Final - deploy Netlify 422'),
          ]
          for old, new in pairs:
              if old not in s:
                  raise SystemExit(f'Expected PUBLICAR_NETLIFY marker not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
          echo "f87b7d887162da4d8fca647d6f23ff43eabecd5e5af8fb7c789467478f0d4b0e  PUBLICAR_NETLIFY.bat" | sha256sum -c -
          rm -f vite.config.d.ts

          echo "969ea6d7829f622ecebff962783a61cbd2b44502456ae356599fbc034ffb203f  .ci-v441-r2/manifest-fix.patch" | sha256sum -c -
          git apply --check .ci-v441-r2/manifest-fix.patch
          git apply .ci-v441-r2/manifest-fix.patch
          echo "340a55e219926692937253d3e6be93071001ada104190606663d384141b0bfc8  verify-http.py" | sha256sum -c -
          echo "c261d8638f7437877f07ae3d0f250875443f9565a509216579191ad233087e71  scripts/release-audit.mjs" | sha256sum -c -

      - name: Apply exact v4.4.2 Admin delta
        shell: bash
        run: |
          set -euo pipefail

          # Existing-file delta.
          cat .ci-v442/seg_* > /tmp/v442-admin.patch.xz.b64
          test "$(wc -c < /tmp/v442-admin.patch.xz.b64)" -eq 24636
          echo "2297c11564ba2d6c3d8d148882966b65b5812147647a09d97d9949a585c5b722  /tmp/v442-admin.patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/v442-admin.patch.xz.b64 > /tmp/v442-admin.patch.xz
          test "$(wc -c < /tmp/v442-admin.patch.xz)" -eq 18476
          echo "88708222999ef71cb24b5ce71f0e7143a13df1b51371dcc01806bbc7ec9a790b  /tmp/v442-admin.patch.xz" | sha256sum -c -
          xz -dc /tmp/v442-admin.patch.xz > /tmp/v442-admin.patch
          test "$(wc -c < /tmp/v442-admin.patch)" -eq 82752
          echo "1bc2f86d53cb41dabcf3bb100d88ce9181186ccb133078ef5a734a5d60b5ece9  /tmp/v442-admin.patch" | sha256sum -c -
          git apply --check /tmp/v442-admin.patch
          git apply /tmp/v442-admin.patch

          # New-file delta. Kept separately so untracked source files cannot be silently omitted.
          cat .ci-v442-new/seg_* > /tmp/v442-newfiles.patch.xz.b64
          test "$(wc -c < /tmp/v442-newfiles.patch.xz.b64)" -eq 5596
          echo "238adf7015e2f03c975d6aacdec73d1896853a4ac2f3f9323f21bf5468377a2a  /tmp/v442-newfiles.patch.xz.b64" | sha256sum -c -
          base64 -d /tmp/v442-newfiles.patch.xz.b64 > /tmp/v442-newfiles.patch.xz
          test "$(wc -c < /tmp/v442-newfiles.patch.xz)" -eq 4196
          echo "813121c0542d8da71a719a82caefa1fcc9f2865b922e4a95f20c419a5c673f97  /tmp/v442-newfiles.patch.xz" | sha256sum -c -
          xz -dc /tmp/v442-newfiles.patch.xz > /tmp/v442-newfiles.patch
          test "$(wc -c < /tmp/v442-newfiles.patch)" -eq 17644
          echo "7c87bc559df1f7f085b85835cb5cfa2cc5435e648faa9384c405a404c8b87ba4  /tmp/v442-newfiles.patch" | sha256sum -c -
          git apply --check /tmp/v442-newfiles.patch
          git apply /tmp/v442-newfiles.patch

          test "$(node -p "require('./package.json').version")" = "4.4.2"
          test -f supabase/migrations/012_admin_gestao_total_4.4.2.sql
          grep -q "admin_change_user_plan" supabase/migrations/012_admin_gestao_total_4.4.2.sql
          grep -q "admin_replace_cpf" supabase/migrations/012_admin_gestao_total_4.4.2.sql
          grep -q "admin_set_user_role" supabase/migrations/012_admin_gestao_total_4.4.2.sql
          grep -q "tributo-leve-admin-role-management" supabase/migrations/012_admin_gestao_total_4.4.2.sql
          test ! -e vite.config.js
          test ! -e vite.config.d.ts
          test ! -e .ci-v441-local
          test ! -d __pycache__
          ! find . -type f -name '*.pyc' -print -quit | grep -q .

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean dependency install
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full quality gate
        run: npm run quality

      - name: Production Vite build
        run: npm run build

      - name: Production HTTP smoke
        run: python verify-http.py

      - name: Performance budget
        run: npm run perf:budget

      - name: Link Netlify project
        run: npx --yes netlify-cli@27.3.0 link --id "$NETLIFY_SITE_ID"

      - name: Netlify production build
        run: npx --yes netlify-cli@27.3.0 build --context production

      - name: Smoke after Netlify build
        run: python verify-http.py

      - name: Preserve compiled output
        uses: actions/upload-artifact@v4
        with:
          name: tributo-leve-v4.4.2-admin-dist
          path: dist
          if-no-files-found: error
